<style>
:root{--bg:#07080b;--bg2:#0d1016;--card:rgba(18,21,29,.9);--card2:#11151d;--tx:#f7f8fb;--mu:#a1a8b8;--ln:rgba(255,255,255,.11);--ln2:rgba(255,255,255,.2);--ac:#b7ff39;--ac2:#57d9ff;--bad:#ff6b7a;--good:#67e8a5;--shadow:0 18px 48px rgba(0,0,0,.28);color-scheme:dark}

*{box-sizing:border-box}html{min-width:320px;background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,color-mix(in srgb,var(--ac2) 14%,transparent),transparent 31rem),radial-gradient(circle at 92% 8%,color-mix(in srgb,var(--ac) 12%,transparent),transparent 28rem),var(--bg);color:var(--tx);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.wrap{width:min(100% - 28px,1080px);margin:auto;padding:14px 0 28px}nav{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;overflow:auto;padding:10px 0 15px;background:linear-gradient(var(--bg) 72%,transparent);scrollbar-width:none}nav::-webkit-scrollbar{display:none}.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:max-content;padding-right:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:11px}.lionMark{display:grid;place-items:center;width:34px;height:34px;border:1px solid color-mix(in srgb,var(--ac) 65%,var(--ln));border-radius:11px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 25%,transparent),transparent);color:var(--ac);font-size:18px;box-shadow:0 0 24px color-mix(in srgb,var(--ac) 18%,transparent)}.lionLogo{width:42px;height:42px;object-fit:cover;object-position:center 46%;border:1px solid color-mix(in srgb,var(--ac) 65%,var(--ln));border-radius:12px;background:#100f13;box-shadow:0 0 24px color-mix(in srgb,var(--ac) 18%,transparent)}.reelCard{display:flex;flex-direction:column;min-height:190px;padding:0;border:1px solid var(--ln);border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--card2) 94%,transparent),color-mix(in srgb,var(--ac) 7%,var(--card)));overflow:hidden}.reelCover{display:grid;place-items:center;min-height:104px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--ac2) 30%,transparent),transparent 55%),linear-gradient(135deg,#12141c,#08090c);color:var(--ac);font-size:30px}.reelBody{padding:13px}.reelBody b{display:block;line-height:1.25}.reelBody p{margin:6px 0 0}.reelCard a{color:var(--ac2);font-size:12px;font-weight:700;text-decoration:none}.reelCard a:hover{text-decoration:underline}button,.button{min-height:42px;border:1px solid var(--ln2);border-radius:12px;padding:9px 14px;background:color-mix(in srgb,var(--card) 88%,transparent);color:var(--tx);font:inherit;font-weight:700;white-space:nowrap;cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}button:hover,.button:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--ac) 60%,var(--ln2));box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 12%,transparent)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--ac2) 55%,transparent);outline-offset:2px}button:disabled{opacity:.55;cursor:wait}.active,.primary{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac2) 55%,var(--ac)));border-color:transparent;color:#071016;box-shadow:0 10px 28px color-mix(in srgb,var(--ac) 18%,transparent)}:root[data-theme="light"] .active,:root[data-theme="light"] .primary{color:#fff}.panel{display:none}.panel.activePanel{display:block}.card{position:relative;margin:0 0 16px;padding:clamp(16px,3vw,24px);border:1px solid var(--ln);border-radius:22px;background:linear-gradient(145deg,color-mix(in srgb,var(--card) 96%,transparent),color-mix(in srgb,var(--card2) 84%,transparent));box-shadow:var(--shadow);overflow:hidden}.card:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ac) 70%,transparent),transparent)}h1{font-size:clamp(25px,4vw,38px);line-height:1.08;letter-spacing:-.035em;margin:0 0 9px}h2{margin:0 0 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}.muted{color:var(--mu);font-size:13px}.notice{margin:10px 0 16px;padding:12px 14px;border:1px solid var(--ln);border-radius:14px;background: function applyTheme(theme){document.documentElement.dataset.theme=theme;try{localStorage.setItem("mkpro-theme",theme)}catch{};tabs()}
function openTab(id){currentTab=id;for(const p of document.querySelectorAll(".panel"))p.classList.toggle("activePanel",p.id===id);tabs();if(id==="dashboard")renderDashboard();if(id==="mediaKit")renderMediaKit();if(id==="editor")renderEditor();if(id==="connection")renderConnection();showMessage("")}

function metricCard(label,value,sub=""){return `<div class="metric"><span>${safe(label)}</span><strong>${fmt(value)}</strong>${sub?`<small class="muted">${safe(sub)}</small>`:""}</div>`}
function dateLabel(d){if(!d)return "";const x=new Date(d+"T12:00:00");return Number.isNaN(x.getTime())?d:new Intl.DateTimeFormat("pt-BR").format(x)}
function graph(){const days=Number(period),cut=Date.now()-days*86400000;const rows=(S.hist||[]).filter(x=>{const t=new Date((x.d||"")+"T23:59:59").getTime();return Number.isFinite(t)&&t>=cut&&toNum(x[chartMetric])!==null}).sort((a,b)=>a.d.localeCompare(b.d));if(rows.length<2)return `<p class="muted">Ainda não há dois registros de ${safe(({f:"seguidores",r:"alcance",v:"visualizações",e:"interações"})[chartMetric])} neste período.</p>`;const vals=rows.map(x=>Number(x[chartMetric])),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1,W=640,H=170;const pts=vals.map((v,i)=>[12+i*(W-24)/(vals.length-1),H-18-(v-min)/range*(H-40)]);const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ${safe(chartMetric)}" style="width:100%;height:auto"><path d="${path}" fill="none" stroke="var(--ac)" stroke-width="3"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--ac)"/>`).join("")}</svg><p class="muted">${dateLabel(rows[0].d)} a ${dateLabel(rows.at(-1).d)} · ${rows.length} registros salvos neste navegador</p>`}
function renderDashboard(){const m=S.m[period]||{};$("dashboard").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><h1>Seu painel</h1><div class="muted">${S.zernio.accountName?`Instagram conectado: @${safe(S.zernio.accountName)}`:"Ainda não sincronizado. Abra Conexão para buscar os dados da Zernio."}</div></div><button class="primary" id="syncDash" type="button" ${isSyncing?"disabled":""}>${isSyncing?"Sincronizando…":"Sincronizar dados"}</button></div><div class="field" style="max-width:230px"><label for="period">Período</label><select id="period"><option value="7" ${period==="7"?"selected":""}>Últimos 7 dias</option><option value="30" ${period==="30"?"selected":""}>Últimos 30 dias</option><option value="90" ${period==="90"?"selected":""}>Últimos 90 dias</option></select></div><p class="muted">${S.sync.last?`Última sincronização: ${new Date(S.sync.last).toLocaleString("pt-BR")}`:"Ainda não sincronizado."}</p></div><div class="grid">${metricCard("Seguidores · automático",m.followers,"Prioridade: conta Instagram")}${metricCard("Alcance",m.reach)}${metricCard("Visualizações",m.views)}${metricCard("Interações",m.interactions)}${metricCard("Contas engajadas",m.engaged)}${metricCard("Visitas ao perfil",m.profileViews)}</div><div class="card"><div class="row" style="justify-content:space-between"><h2>Evolução salva</h2><select id="chartMetric" style="width:auto"><option value="f" ${chartMetric==="f"?"selected":""}>Seguidores</option><option value="r" ${chartMetric==="r"?"selected":""}>Alcance</option><option value="v" ${chartMetric==="v"?"selected":""}>Visualizações</option><option value="e" ${chartMetric==="e"?"selected":""}>Interações</option></select></div>${graph()}</div><div class="card"><h2>Melhores publicações</h2>${renderPosts(S.zernio.posts,"dashPosts")}</div>`;$("syncDash").onclick=()=>{if(!adminPassword){showMessage("Abra Conexão, digite a senha do painel e toque em Sincronizar.","error");openTab("connection");return}syncData()};$("period").onchange=e=>{period=e.target.value;renderDashboard()};$("chartMetric").onchange=e=>{chartMetric=e.target.value;renderDashboard()}}
function renderPosts(posts,id="postsCarousel"){if(!Array.isArray(posts)||!posts.length)return `<p class="muted">Nenhuma publicação com analytics foi retornada neste período. Você também pode preencher destaques manualmente na aba Editar.</p>`;return `<div class="carousel"><button class="carouselArrow" type="button" data-carousel="${id}" data-dir="-1" aria-label="Publicações anteriores">‹</button><div class="carouselTrack" id="${id}">${posts.slice(0,5).map(p=>`<article class="post">${p.thumbnailUrl?`<img class="thumb" src="${safe(p.thumbnailUrl)}" alt="">`:`<div class="thumb"></div>`}<div><b>${safe((p.content||"Publicação do Instagram").slice(0,110))}</b><div class="muted">${safe(dateLabel((p.publishedAt||"").slice(0,10)))} · alcance ${fmt(p.analytics?.reach)} · curtidas ${fmt(p.analytics?.likes)} · comentários ${fmt(p.analytics?.comments)}</div>${p.url?`<p><a href="${safe(p.url)}" target="_blank" rel="noopener noreferrer">Abrir publicação ↗</a></p>`:""}</div></article>`).join("")}</div><button class="carouselArrow" type="button" data-carousel="${id}" data-dir="1" aria-label="Próximas publicações">›</button></div>`}
function renderBars(text){const items=String(text||"").split("\n").map(line=>{const [label,value]=line.split(":");const n=Number.parseFloat(value);return {label:(label||"").trim(),n}}).filter(x=>x.label&&Number.isFinite(x.n));if(!items.length)return `<p class="muted">Sem dados demográficos. A Zernio pode exigir 100 seguidores e acesso Analytics.</p>`;return items.map(x=>`<div><div class="row" style="justify-content:space-between"><span>${safe(x.label)}</span><span class="muted">${x.n.toFixed(1)}%</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,x.n))}%"></i></div></div>`).join("")}
function renderPortfolio(items){const list=Array.isArray(items)?items.slice(0,5):[];return `<div class="carousel"><button class="carouselArrow" type="button" data-carousel="portfolioCarousel" data-dir="-1" aria-label="Reels anteriores">‹</button><div class="portfolioGrid" id="portfolioCarousel">${list.map((r,i)=>`<article class="reelCard"><div class="reelCover" aria-hidden="true">▶</div><div class="reelBody"><b>${safe(r.title||`Reel de portfólio ${i+1}`)}</b><p class="muted">${safe(r.description||"Adicione uma descrição comercial para este Reel.")}</p>${r.url?`<p><a href="${safe(r.url)}" target="_blank" rel="noopener noreferrer">Abrir Reel ↗</a></p>`:`<p class="muted small">Link ainda não adicionado</p>`}</div></article>`).join("")}</div><button class="carouselArrow" type="button" data-carousel="portfolioCarousel" data-dir="1" aria-label="Próximos Reels">›</button></div>`}
function renderMediaKit(){const p=S.p,m=S.m["30"]||{},c=S.ct;document.documentElement.style.setProperty("--ac",/^#[0-9a-f]{6}$/i.test(p.accent)?p.accent:"#7057e8");const prices=(S.prices||[]).filter(x=>x.n||x.p);$("mediaKit").innerHTML=`<div class="row noPrint" style="margin-bottom:10px"><button type="button" id="pdf" class="primary">Exportar / imprimir PDF</button><button type="button" id="copySummary">Copiar resumo</button></div><div class="card profile">${p.photo?`<img class="avatar" src="${safe(p.photo)}" alt="Foto de ${safe(p.name)}">`:`<div class="avatar"></div>`}<div><h1>${safe(p.name||"Seu nome")}</h1><div class="muted">${p.handle?"@"+safe(p.handle.replace(/^@/,"")):""}${p.niche?" · "+safe(p.niche):""}</div><p>${safe(p.bio)}</p></div></div><div class="grid">${metricCard("Seguidores",m.followers)}${metricCard("Alcance · 30 dias",m.reach)}${metricCard("Visualizações · 30 dias",m.views)}${metricCard("Interações · 30 dias",m.interactions)}</div><div class="card"><h2>Dados da audiência</h2><div class="two"><div><b>Faixa etária</b>${renderBars(S.demo.age)}</div><div><b>Gênero</b>${renderBars(S.demo.gender)}</div><div><b>Cidades</b>${renderBars(S.demo.cities)}</div></div></div>${S.top?`<div class="card"><h2>Destaques</h2>${S.top.split("\n").filter(Boolean).map(x=>`<p>${safe(x)}</p>`).join("")}</div>`:""}${S.brands?`<div class="card"><h2>Marcas parceiras</h2><p>${S.brands.split("\n").filter(Boolean).map(safe).join(" · ")}</p></div>`:""}${S.services?`<div class="card"><h2>Serviços</h2><p>${S.services.split("\n").filter(Boolean).map(safe).join("<br>")}</p></div>`:""}${prices.length?`<div class="card tableWrap"><h2>Pacotes e valores</h2><table>${prices.map(x=>`<tr><td><b>${safe(x.n)}</b><br><span class="muted">${safe(x.d)}</span></td><td>${safe(x.p)}</td></tr>`).join("")}</table></div>`:""}<div class="card"><h2>Contato</h2>${c.wa?`<p>WhatsApp: ${safe(c.wa)}</p>`:""}${c.email?`<p>E-mail: ${safe(c.email)}</p>`:""}${c.site?`<p>Site: ${safe(c.site)}</p>`:""}</div><div class="card"><h2>Publicações</h2>${renderPosts(S.zernio.posts,"kitPosts")}</div>`;$("pdf").onclick=()=>window.print();$("copySummary").onclick=async()=>{const text=`${S.p.name||"Media Kit"} ${S.p.handle?"(@"+S.p.handle+")":""}\nSeguidores: ${fmt(m.followers)} · Alcance: ${fmt(m.reach)} · Interações: ${fmt(m.interactions)}\n${c.email||""} ${c.wa||""}`;try{await navigator.clipboard.writeText(text);showMessage("Resumo copiado.","success")}catch{showMessage("Não foi possível copiar automaticamente neste navegador.","error")}}}
function field(label,key,type="text",placeholder=""){return `<div class="field"><label>${safe(label)}</label><input data-key="${safe(key)}" type="${safe(type)}" value="${safe(get(S,key))}" placeholder="${safe(placeholder)}"></div>`}
function area(label,key,placeholder=""){return `<div class="field"><label>${safe(label)}</label><textarea data-key="${safe(key)}" placeholder="${safe(placeholder)}">${safe(get(S,key))}</textarea></div>`}
function renderEditor(){const days=["7","30","90"];$("editor").innerHTML=`<div class="card"><h1>Editar seu Media Kit</h1><p class="muted">O que você digitar é salvo automaticamente neste navegador.</p><h2>Perfil</h2>${field("Nome","p.name")}${field("Instagram","p.handle","text","@seuusuario")}${field("Nicho","p.niche")}${area("Biografia","p.bio")}<div class="field"><label>Foto do perfil</label><input id="photoFile" type="file" accept="image/*"></div><div class="field"><label>Cor de destaque</label><input data-key="p.accent" type="color" value="${safe(S.p.accent)}"></div></div>${days.map(d=>`<div class="card"><h2>Métricas · ${d} dias</h2><div class="two">${field("Seguidores",`m.${d}.followers`,`number`)}${field("Alcance",`m.${d}.reach`,`number`)}${field("Visualizações",`m.${d}.views`,`number`)}${field("Interações",`m.${d}.interactions`,`number`)}</div></div>`).join("")}<div class="card"><h2>Audiência</h2>${area("Idade (exemplo: 18-24: 35)","demo.age")}${area("Gênero (exemplo: Mulheres: 60)","demo.gender")}${area("Cidades (exemplo: São Paulo: 22)","demo.cities")}</div><div class="card"><h2>Conteúdo e comercial</h2>${area("Destaques manuais — uma linha por item","top")}${area("Marcas parceiras — uma por linha","brands")}${area("Serviços — um por linha","services")}</div><div class="card"><h2>Pacotes e valores</h2><div id="priceRows"></div><button id="addPrice" type="button">Adicionar pacote</button></div><div class="card"><h2>Portfólio de Reels</h2><p class="muted">Cinco espaços para apresentar seus melhores conteúdos comerciais, demonstrações e campanhas.</p>${renderPortfolio(S.portfolio)}</div><div class="card"><h2>Portfólio · 5 Reels</h2><p class="muted">Cole o link do Instagram, TikTok ou YouTube de cada trabalho. Esses cards aparecerão no seu Media Kit.</p>${(S.portfolio||[]).slice(0,5).map((r,i)=>`<div class="card"><h2>Reel ${i+1}</h2>${field("Título",`portfolio.${i}.title`,"text",`Ex.: Reel de venda ${i+1}`)}${field("Descrição",`portfolio.${i}.description`,"text","Ex.: demonstração e chamada para ação")}${field("Link do Reel",`portfolio.${i}.url`,"url","https://...")}</div>`).join("")}</div><div class="card"><h2>Contato</h2>${field("WhatsApp","ct.wa","tel") }${field("E-mail","ct.email","email")}${field("Site","ct.site","url")}</div></div>`;renderPriceRows();$("editor").oninput=e=>{const key=e.target.dataset.key;if(key){set(key,e.target.type==="number"&&e.target.value!==""?Number(e.target.value):e.target.value);save();if(key==="p.accent")document.documentElement.style.setProperty("--ac",e.target.value);if(key.startsWith("portfolio."))save()}};$("editor").onchange=e=>{if(e.target.id==="photoFile"){const file=e.target.files?.[0];if(!file)return;if(file.size>8*1024*1024){showMessage("A foto deve ter menos de 8 MB.","error");e.target.value="";return}const img=new Image();img.onload=()=>{const canvas=document.createElement("canvas");canvas.width=canvas.height=400;const size=Math.min(img.width,img.height),ctx=canvas.getContext("2d");ctx.drawImage(img,(img.width-size)/2,(img.height-size)/2,size,size,0,0,400,400);S.p.photo=canvas.toDataURL("image/jpeg",.82);save();showMessage("Foto salva neste navegador.","success")};img.src=URL.createObjectURL(file)}};$("addPrice").onclick=()=>{S.prices.push({n:"",p:"",d:""});save();renderPriceRows()}}
function renderPriceRows(){$("priceRows").innerHTML=(S.prices||[]).map((r,i)=>`<div class="card"><div class="two"><div><label>Pacote</label><input data-price="${i}" data-field="n" value="${safe(r.n)}"></div><div><label>Preço</label><input data-price="${i}" data-field="p" value="${safe(r.p)}"></div></div><label>Descrição</label><input data-price="${i}" data-field="d" value="${safe(r.d)}"><button type="button" data-remove-price="${i}" aria-label="Remover pacote">Remover</button></div>`).join("");$("priceRows").oninput=e=>{const i=e.target.dataset.price,k=e.target.dataset.field;if(i!==undefined&&k){S.prices[Number(i)][k]=e.target.value;save()}};$("priceRows").onclick=e=>{const i=e.target.dataset.removePrice;if(i!==undefined){S.prices.splice(Number(i),1);save();renderPriceRows()}}}
function scheduleAutomaticSync(){clearTimeout(autoSyncTimer);if(!adminPassword)return;autoSyncTimer=setTimeout(()=>{if(!isSyncing)syncData()},900)}
function startAutomaticRefresh(){if(autoRefreshTimer)return;autoRefreshTimer=setInterval(()=>{if(adminPassword&&!isSyncing)syncData()},5*60*1000)}
function renderConnection(){const a=S.zernio.accountName?`Conta ligada anteriormente: @${safe(S.zernio.accountName)}`:"A conta do Instagram precisa estar conectada primeiro dentro da Zernio.";$("connection").innerHTML=`<div class="card"><h1>Conexão com Zernio</h1><p>${a}</p><p class="muted">Esta senha é <b>ADMIN_PASSWORD</b>, a senha do painel cadastrada no Netlify. Não é a senha do Instagram nem a chave Zernio.</p><div class="field"><label for="adminPassword">Senha do painel</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Digite a senha ADMIN_PASSWORD"></div><div class="row"><button id="syncNow" type="button" class="primary" ${isSyncing?"disabled":""}>${isSyncing?"Sincronizando…":"Testar senha e sincronizar"}</button><button id="clearPassword" type="button">Apagar senha da tela</button></div><p class="muted">A senha fica somente na memória desta página e é apagada quando você fecha ou recarrega o site. Depois de digitada, a sincronização começa automaticamente; enquanto esta página estiver aberta, os dados são atualizados a cada 5 minutos.</p><div id="syncDetails"></div></div><div class="card"><h2>O que será buscado</h2><p>Seguidores, alcance, visualizações, interações, dados demográficos e publicações, quando a Zernio e as permissões do Instagram disponibilizarem esses dados.</p><p class="muted">A Meta pode atrasar métricas. Demografia pode exigir 100 ou mais seguidores. Alguns recursos dependem do acesso Analytics no plano Zernio.</p></div>`;$("adminPassword").value=adminPassword;$("adminPassword").oninput=e=>{adminPassword=e.target.value; scheduleAutomaticSync()};$("adminPassword").onblur=()=>{clearTimeout(autoSyncTimer);if(adminPassword&&!isSyncing)syncData()};$("syncNow").onclick=syncData;$("clearPassword").onclick=()=>{adminPassword="";$("adminPassword").value="";showMessage("Senha apagada da tela.","success")}}
async function api(path){if(!adminPassword)throw Object.assign(new Error("Digite a senha ADMIN_PASSWORD do Netlify."),{code:"ADMIN_PASSWORD_EMPTY"});let response;try{response=await fetch(path,{method:"GET",headers:{"x-senha":adminPassword,"accept":"application/json"},cache:"no-store"})}catch{throw Object.assign(new Error("Não foi possível conectar ao site. Verifique a internet e tente novamente."),{code:"NETWORK_ERROR"})}let data={};try{data=await response.json()}catch{}if(!response.ok)throw Object.assign(new Error(data.message||`Erro HTTP ${response.status}.`),{code:data.code||"HTTP_ERROR",status:response.status,details:data});return data}
function errorText(err){switch(err.code){case"ADMIN_PASSWORD_EMPTY":return"Digite a senha ADMIN_PASSWORD do Netlify.";case"ADMIN_PASSWORD_INVALID":return"A senha do painel não confere. Confira ADMIN_PASSWORD no Netlify.";case"ZERNIO_KEY_INVALID":return"A senha do painel foi aceita, mas a Zernio recusou ZERNIO_API_KEY. Confira a chave no Netlify.";case"ADMIN_PASSWORD_MISSING":return"Falta criar ADMIN_PASSWORD nas variáveis do Netlify.";case"ZERNIO_KEY_MISSING":return"Falta ZERNIO_API_KEY nas variáveis do Netlify.";case"ZERNIO_ANALYTICS_REQUIRED":return"A Zernio exige acesso Analytics para essa métrica. Confira o plano e o acesso Analytics da conta.";case"ZERNIO_PERMISSION_DENIED":return"A Zernio não tem permissão para ler esses dados do Instagram. Confira a conexão e as permissões da conta.";case"NETWORK_ERROR":return err.message;case"ACCOUNT_ID_INVALID":return"Não encontrei um ID válido para a conta Instagram.";default:return err.message||"Erro inesperado. Tente novamente."}}
function accountIdOf(a){return String(a?.id||a?.accountId||a?.socialAccountId||a?._id||"")}
function metricValue(x){if(x===null||x===undefined)return null;if(typeof x==="number")return x;if(typeof x==="object"){const total=toNum(x.total);if(total!==null)return total;const values=Array.isArray(x.values)?x.values:[];if(values.length){const sorted=[...values].sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));return toNum(sorted.at(-1)?.value)}}return toNum(x)}
function demographicText(value){if(!value)return"";let items=[];if(Array.isArray(value)){items=value.map(x=>[x.label||x.name||x.dimension||x.key||x.age||x.city||x.gender||"",x.percentage??x.percent??x.share??x.value??x.count])}else if(typeof value==="object"){items=Object.entries(value).map(([k,v])=>[k,typeof v==="object"?(v.percentage??v.percent??v.share??v.value??v.count):v])}return items.map(([k,v])=>{let n=Number(v);if(n>0&&n<=1)n*=100;return k&&Number.isFinite(n)?`${k}: ${n.toFixed(1)}`:""}).filter(Boolean).join("\n")}
async function syncData(){if(isSyncing)return;if(!adminPassword){if(currentTab!=="connection")openTab("connection");showMessage("Digite a senha ADMIN_PASSWORD do Netlify e toque em Testar senha e sincronizar.","error");return}isSyncing=true;showMessage("Conferindo senha e procurando sua conta Instagram…");if(currentTab==="dashboard")renderDashboard();if(currentTab==="connection")renderConnection();try{const accountList=await api("/api/zernio/accounts");const accounts=Array.isArray(accountList.accounts)?accountList.accounts:[];const account=accounts.find(x=>String(x.platform||"").toLowerCase()==="instagram");if(!account)throw Object.assign(new Error("A Zernio não retornou uma conta Instagram conectada. Confira Connections na Zernio."),{code:"NO_INSTAGRAM_ACCOUNT"});const accountId=accountIdOf(account);if(!accountId)throw Object.assign(new Error("A resposta da Zernio não trouxe o ID da conta. A integração precisa ajustar o campo de ID."),{code:"ACCOUNT_ID_INVALID"});S.zernio.accountId=accountId;S.zernio.accountName=account.username||account.handle||account.displayName||account.name||"Instagram";S.zernio.hasAnalyticsAccess=accountList.hasAnalyticsAccess??null;S.p.name=account.displayName||account.name||S.p.name;S.p.handle=account.username||account.handle||S.p.handle;S.p.bio=account.profileData?.bio||account.bio||S.p.bio;S.p.photo=account.profilePicture||account.profilePictureUrl||account.avatarUrl||S.p.photo;const fallbackFollowers=toNum(account.followersCount??account.followerCount);const q=`accountId=${encodeURIComponent(accountId)}&days=${period}`;const tasks=await Promise.allSettled([api(`/api/zernio/insights?${q}`),api(`/api/zernio/follower-history?${q}`),api(`/api/zernio/demographics?accountId=${encodeURIComponent(accountId)}`),api(`/api/zernio/posts?${q}`)]);const labels=["Insights do perfil","Histórico de seguidores","Demografia","Publicações"];const errors=[];const value=i=>tasks[i].status==="fulfilled"?tasks[i].value:null;tasks.forEach((t,i)=>{if(t.status==="rejected")errors.push(`${labels[i]}: ${errorText(t.reason)}`)});const insights=value(0),history=value(1),demographics=value(2),postData=value(3);const raw=insights?.metrics||{};const warnings=[...(insights?.unavailableMetrics||[]),...(history?.unavailableMetrics||[])].map(x=>`${x.metric||"Métrica"}: ${x.reason==="no_data"?"sem dados neste período":x.reason||"indisponível"}`);if(insights&&!Object.keys(raw).length)warnings.push("A Zernio não retornou métricas do perfil para este período.");const followers=metricValue(history?.metrics?.follower_count)??fallbackFollowers;const metrics={followers,reach:metricValue(raw.reach),views:metricValue(raw.views),interactions:metricValue(raw.total_interactions),engaged:metricValue(raw.accounts_engaged),profileViews:metricValue(raw.profile_views)};const key=period;S.m[key]={...(S.m[key]||{})};for(const [k,v] of Object.entries(metrics))if(v!==null)S.m[key][k]=v;S.demo.age=demographicText(demographics?.demographics?.age)||S.demo.age;S.demo.gender=demographicText(demographics?.demographics?.gender)||S.demo.gender;S.demo.cities=demographicText(demographics?.demographics?.city)||S.demo.cities;const vals=history?.metrics?.follower_count?.values;if(Array.isArray(vals)){for(const item of vals){const d=String(item.date||"").slice(0,10),f=toNum(item.value);if(!d||f===null)continue;const old=S.hist.find(x=>x.d===d)||{d};old.f=f;if(item.date)old.source="zernio";if(!S.hist.some(x=>x.d===d))S.hist.push(old)}}const today=new Date().toISOString().slice(0,10);if(followers!==null){const todayRow=S.hist.find(x=>x.d===today)||{d:today};todayRow.f=followers;if(metrics.reach!==null)todayRow.r=metrics.reach;if(metrics.views!==null)todayRow.v=metrics.views;if(metrics.interactions!==null)todayRow.e=metrics.interactions;if(!S.hist.some(x=>x.d===today))S.hist.push(todayRow)}const rawPosts=Array.isArray(postData?.posts)?postData.posts:[];S.zernio.posts=rawPosts.map(p=>{const pa=Array.isArray(p.platformAnalytics)?p.platformAnalytics.find(x=>String(x.platform||"").toLowerCase()==="instagram"):null;return {content:p.content||p.caption||"Publicação do Instagram",publishedAt:p.publishedAt||p.createdAt||"",thumbnailUrl:p.thumbnailUrl||p.mediaItems?.[0]?.thumbnail||"",url:pa?.platformPostUrl||p.platformPostUrl||"",analytics:p.analytics||pa?.analytics||{}}}).slice(0,10);S.sync.last=Date.now();save();startAutomaticRefresh();if(errors.length||warnings.length){showMessage(`Atualização parcial. ${[...errors,...warnings].join(" · ")}`,"error")}else if(S.zernio.hasAnalyticsAccess===false){showMessage("Sincronização concluída. A Zernio informa que esta conta não tem acesso Analytics; alguns números podem ficar vazios.","success")}else{showMessage("Sincronização concluída. Os dados disponíveis foram atualizados.","success")}if(currentTab==="connection")renderConnection();if(currentTab==="dashboard")renderDashboard();if(currentTab==="mediaKit")renderMediaKit()}catch(err){showMessage(errorText(err),"error");if(currentTab==="connection")renderConnection()}finally{isSyncing=false;if(currentTab==="dashboard")renderDashboard();if(currentTab==="connection")renderConnection()}}
